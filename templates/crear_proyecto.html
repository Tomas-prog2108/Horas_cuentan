{% extends "base_profesor.html" %}

{% block head %}
    <meta charset="UTF-8">
    <title>Crear proyecto</title>
    <link rel="stylesheet" href="/static/css/crear_proyecto.css">
    <link rel="stylesheet" href="/static/css/base.css">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
{% endblock %}

{% block main %}
    <main class="main">
        <section class="container">

            <a href="/g_proyectos" class="volver"><i class="fa-solid fa-arrow-left"></i> {{ titulo }}</a>

            <form method="post" action="{{ accion }}" class="form-proyecto">

                <div class="columna">

                    <label class="campo-label" for="nombre">Nombre del proyecto</label>
                    <input type="text" id="nombre" name="nombre" class="campo" placeholder="Ej. Apoyo ambiental"
                           value="{{ proyecto.nombre if proyecto else '' }}" required maxlength="100">

                    <label class="campo-label" for="descripcion">Descripción</label>
                    <textarea id="descripcion" name="descripcion" class="campo campo-textarea"
                              placeholder="Describe las actividades que realizará el estudiante...">{{ (proyecto.descripcion or '') if proyecto else '' }}</textarea>

                    <label class="campo-label" for="horas">Horas que otorga</label>
                    <input type="number" id="horas" name="horas" class="campo" placeholder="Ej. 10"
                           min="0.5" step="0.5"
                           value="{{ '%g'|format(proyecto.horas_otorgadas) if proyecto else '' }}" required>

                    <label class="campo-label" for="fecha_inicio">Fecha de inicio</label>
                    <input type="date" id="fecha_inicio" name="fecha_inicio" class="campo"
                           value="{{ proyecto.fecha_inicio.isoformat() if proyecto else '' }}" required>

                </div>

                <div class="columna">

                    <label class="campo-label" for="profesor">Profesor encargado</label>
                    <input type="text" id="profesor" class="campo" value="{{ profesor.nombre }}" disabled>

                    <label class="campo-label" for="lugar">Lugar en la institución</label>
                    <input type="text" id="lugar" name="lugar" class="campo" placeholder="Ej. Biblioteca institucional"
                           value="{{ proyecto.lugar if proyecto else '' }}" required maxlength="100">

                    <label class="campo-label" for="cupos">Cupos disponibles</label>
                    <input type="number" id="cupos" name="cupos" class="campo" placeholder="Ej. 20" min="1"
                           value="{{ proyecto.cupos if proyecto else '' }}" required>

                    <label class="campo-label" for="estado">Estado del proyecto</label>
                    <select id="estado" name="estado" class="campo">
                        <option value="activo" {% if not proyecto or proyecto.estado == 'activo' %}selected{% endif %}>Activo</option>
                        <option value="inactivo" {% if proyecto and proyecto.estado == 'inactivo' %}selected{% endif %}>Inactivo</option>
                    </select>

                </div>

                <div class="acciones-form">
                    <a href="/g_proyectos" class="btn-cancelar">Cancelar</a>
                    <button type="submit" class="btn-guardar"><i class="fa-solid fa-floppy-disk"></i> Guardar proyecto</button>
                </div>

            </form>

        </section>
    </main>
{% endblock %}

{% block script %}
    <script src="/static/js/crear_proyecto.js"></script>
    <script src="/static/js/base.js"></script>
{% endblock %}
